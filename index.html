<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Metadata (EXIF) Remover</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="max-w-2xl w-full bg-gray-800 p-6 md:p-8 rounded-2xl shadow-2xl border border-gray-700">
        <div class="text-center mb-6">
            <h2 class="text-3xl font-bold text-green-500 mb-2">🛡️ Image EXIF Stripper</h2>
            <p class="text-sm text-gray-400">ছবির ভেতরের লোকেশন এবং ডিভাইসের হিডেন মেটাডাটা এক ক্লিকে মুছে ফেলুন।</p>
        </div>

        <!-- Upload Area -->
        <div class="mb-6">
            <label class="flex flex-col items-center justify-center w-full h-40 border-2 border-gray-600 border-dashed rounded-xl cursor-pointer bg-gray-700 hover:bg-gray-600 transition-all">
                <div class="flex flex-col items-center justify-center pt-5 pb-6">
                    <svg class="w-10 h-10 mb-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                    <p class="mb-2 text-sm text-gray-300"><span class="font-semibold">Click to upload</span> or drag and drop</p>
                    <p class="text-xs text-gray-400">PNG, JPG or JPEG (Max 10MB)</p>
                </div>
                <input id="imageInput" type="file" accept="image/jpeg, image/png, image/jpg" class="hidden" onchange="handleFile(event)" />
            </label>
        </div>

        <!-- Preview Area -->
        <div id="previewContainer" class="hidden mb-6 flex flex-col items-center">
            <p class="text-sm text-gray-300 mb-2">প্রিভিউ:</p>
            <img id="imagePreview" class="max-w-full h-48 object-contain rounded-lg border border-gray-600 shadow-md" src="" alt="Preview">
            <p id="fileInfo" class="text-xs text-gray-400 mt-2"></p>
        </div>

        <!-- Canvas for stripping (Hidden) -->
        <canvas id="canvas" class="hidden"></canvas>

        <!-- Actions -->
        <div class="flex gap-4">
            <button id="processBtn" onclick="stripMetadata()" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-xl transition-all shadow-lg active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                🧹 Remove Metadata
            </button>
            <button id="downloadBtn" onclick="downloadImage()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition-all shadow-lg hidden">
                ⬇️ Download Clean Image
            </button>
        </div>
        
        <!-- Status Message -->
        <p id="statusMsg" class="text-center text-sm font-semibold mt-4 hidden"></p>
    </div>

    <script>
        let originalImage = new Image();
        let cleanedDataUrl = "";
        let originalFileName = "";

        const imageInput = document.getElementById('imageInput');
        const previewContainer = document.getElementById('previewContainer');
        const imagePreview = document.getElementById('imagePreview');
        const fileInfo = document.getElementById('fileInfo');
        const processBtn = document.getElementById('processBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusMsg = document.getElementById('statusMsg');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function handleFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            originalFileName = file.name;
            const reader = new FileReader();

            reader.onload = function(e) {
                originalImage.src = e.target.result;
                imagePreview.src = e.target.result;
                
                // Show preview and enable process button
                previewContainer.classList.remove('hidden');
                processBtn.disabled = false;
                downloadBtn.classList.add('hidden');
                
                // Reset status
                statusMsg.classList.add('hidden');
                
                const sizeKB = (file.size / 1024).toFixed(2);
                fileInfo.innerText = `File: ${originalFileName} (${sizeKB} KB)`;
            };

            reader.readAsDataURL(file);
        }

        function stripMetadata() {
            if (!originalImage.src) return;

            try {
                // Set canvas size to original image size
                canvas.width = originalImage.width;
                canvas.height = originalImage.height;

                // Draw image on canvas (This action drops EXIF data)
                ctx.drawImage(originalImage, 0, 0, canvas.width, canvas.height);

                // Convert canvas back to image data
                // Using JPEG with 1.0 quality to maintain visual fidelity
                cleanedDataUrl = canvas.toDataURL('image/jpeg', 1.0);

                // Update UI
                statusMsg.innerText = "✅ মেটাডাটা সফলভাবে মুছে ফেলা হয়েছে!";
                statusMsg.className = "text-center text-sm font-semibold mt-4 text-green-400";
                statusMsg.classList.remove('hidden');
                
                processBtn.classList.add('hidden');
                downloadBtn.classList.remove('hidden');

            } catch (error) {
                statusMsg.innerText = "❌ মেটাডাটা মুছতে সমস্যা হয়েছে!";
                statusMsg.className = "text-center text-sm font-semibold mt-4 text-red-400";
                statusMsg.classList.remove('hidden');
            }
        }

        function downloadImage() {
            if (!cleanedDataUrl) return;

            const link = document.createElement('a');
            // Add prefix to filename
            link.download = "Cleaned_" + originalFileName;
            link.href = cleanedDataUrl;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
