<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXIF Stripper Pro</title>
    <!-- Tailwind CSS with Dark Mode Config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        lightBg: '#e8eef5',
                        brandBlue: '#3a73f0',
                    }
                }
            }
        }
    </script>
    <!-- EXIF Manipulation Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/piexifjs/1.0.6/piexif.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .upload-dashed {
            border: 2px dashed #4b78e6;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-lightBg dark:bg-gray-900 transition-colors duration-300">

    <!-- Main Card -->
    <div class="bg-white dark:bg-gray-800 max-w-[420px] w-full rounded-[24px] px-6 py-8 shadow-[0_15px_40px_-15px_rgba(0,0,0,0.1)] dark:shadow-none relative transition-colors duration-300">
        
        <!-- Header Section -->
        <div class="flex justify-between items-center mb-1">
            <h2 class="text-[22px] font-extrabold text-black dark:text-white flex items-center gap-2 transition-colors">
                EXIF Stripper Pro 🛡️
            </h2>
            <!-- Settings Gear Icon -->
            <button onclick="toggleSettings()" class="text-black dark:text-white hover:rotate-90 transition-all duration-300">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
                </svg>
            </button>
        </div>
        <p class="text-[14px] text-gray-500 dark:text-gray-400 mb-6 transition-colors">Remove location & hidden metadata.</p>

        <!-- Dynamic Workspace -->
        <div id="editorWorkspace" class="hidden">
            <!-- Image Preview -->
            <div class="mb-4 flex flex-col items-center">
                <img id="imagePreview" class="max-w-full h-40 object-contain rounded-xl border border-gray-200 dark:border-gray-600 shadow-sm transition-all" src="" alt="Preview">
                <p id="fileInfo" class="text-[11px] text-gray-400 mt-2 font-semibold uppercase tracking-wide"></p>
            </div>
        </div>

        <!-- Settings Menu (Toggled by Gear Icon) -->
        <div id="settingsMenu" class="hidden mb-5 bg-gray-50 dark:bg-gray-700 p-4 rounded-xl border border-gray-200 dark:border-gray-600 transition-colors duration-300">
            
            <!-- Dark Mode Toggle -->
            <div class="flex justify-between items-center mb-4 pb-4 border-b border-gray-200 dark:border-gray-600">
                <span class="text-[13px] font-bold text-gray-700 dark:text-gray-200 uppercase tracking-wide flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                    Dark Mode
                </span>
                <button onclick="toggleTheme()" class="w-12 h-6 rounded-full bg-gray-300 dark:bg-brandBlue relative transition-colors duration-300 focus:outline-none shadow-inner">
                    <div id="themeToggleCircle" class="w-4 h-4 rounded-full bg-white absolute top-1 left-1 dark:translate-x-6 transition-transform duration-300 shadow-sm"></div>
                </button>
            </div>

            <!-- Custom EXIF Fields -->
            <h3 class="text-[12px] font-bold text-gray-700 dark:text-gray-200 mb-3 uppercase tracking-wide">✍️ Custom Device Info</h3>
            <div class="grid grid-cols-2 gap-3">
                <input type="text" id="exifMake" placeholder="Brand (Apple)" class="w-full bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-lg p-2.5 text-[13px] text-gray-800 dark:text-white focus:outline-none focus:border-brandBlue dark:focus:border-brandBlue transition-colors">
                <input type="text" id="exifModel" placeholder="Model (iPhone 15)" class="w-full bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-lg p-2.5 text-[13px] text-gray-800 dark:text-white focus:outline-none focus:border-brandBlue dark:focus:border-brandBlue transition-colors">
            </div>
        </div>

        <!-- Upload Area (Matched with screenshot) -->
        <label id="uploadArea" class="flex flex-col items-center justify-center w-full py-10 px-4 upload-dashed rounded-[16px] cursor-pointer bg-white dark:bg-gray-800 hover:bg-blue-50 dark:hover:bg-gray-700 transition-colors mb-6">
            <div class="bg-brandBlue p-3 rounded-full mb-4 shadow-sm">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                </svg>
            </div>
            <p class="text-[17px] font-extrabold text-black dark:text-white mb-2 tracking-tight transition-colors">Drag & Drop Image here</p>
            <p class="text-[13px] text-gray-500 dark:text-gray-400 text-center leading-relaxed transition-colors">or click to browse from device<br>(JPG/PNG)</p>
            <input id="imageInput" type="file" accept="image/jpeg, image/png, image/jpg" class="hidden" onchange="handleFile(event)" />
        </label>

        <!-- Action Buttons (Hidden Initially) -->
        <div id="actionButtons" class="flex gap-3 mb-2 hidden">
            <button onclick="processImage('remove')" class="flex-1 bg-gray-800 dark:bg-gray-700 hover:bg-black dark:hover:bg-gray-600 text-white font-bold py-3 px-4 rounded-[12px] text-[14px] transition-all shadow-md">
                Clear EXIF
            </button>
            <button onclick="processImage('add')" class="flex-1 bg-brandBlue hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-[12px] text-[14px] transition-all shadow-md">
                Apply Fake
            </button>
        </div>
        
        <button id="downloadBtn" onclick="downloadImage()" class="w-full mt-2 bg-[#22c55e] hover:bg-green-600 text-white font-bold py-3 px-4 rounded-[12px] text-[15px] transition-all shadow-md hidden flex items-center justify-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            Save / Share Image
        </button>
        
        <p id="statusMsg" class="text-center text-[13px] font-bold mt-3 hidden"></p>

        <canvas id="canvas" class="hidden"></canvas>

        <!-- Footer -->
        <p class="text-center text-[14px] font-bold text-[#4a5568] dark:text-gray-400 mt-6 transition-colors">
            Developed by <span class="text-brandBlue">Developer Shuvo</span>
        </p>
    </div>

    <script>
        let originalImage = new Image();
        let originalFileName = "image.jpg";
        let finalBlob = null; 

        const uploadArea = document.getElementById('uploadArea');
        const editorWorkspace = document.getElementById('editorWorkspace');
        const imagePreview = document.getElementById('imagePreview');
        const fileInfo = document.getElementById('fileInfo');
        const settingsMenu = document.getElementById('settingsMenu');
        const actionButtons = document.getElementById('actionButtons');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusMsg = document.getElementById('statusMsg');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Theme Toggle Logic
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
        }

        // Settings Toggle Logic
        function toggleSettings() {
            settingsMenu.classList.toggle('hidden');
        }

        function handleFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            originalFileName = file.name;
            const reader = new FileReader();

            reader.onload = function(e) {
                originalImage.src = e.target.result;
                imagePreview.src = e.target.result;
                imagePreview.classList.remove('border-green-500');
                
                uploadArea.classList.add('hidden'); 
                editorWorkspace.classList.remove('hidden'); 
                
                downloadBtn.classList.add('hidden');
                statusMsg.classList.add('hidden');
                actionButtons.classList.remove('hidden');
                actionButtons.classList.add('flex');
                
                const sizeKB = (file.size / 1024).toFixed(2);
                fileInfo.innerText = `${originalFileName} • ${sizeKB} KB`;
            };

            reader.readAsDataURL(file);
        }

        function processImage(action) {
            if (!originalImage.src) return;

            canvas.width = originalImage.width;
            canvas.height = originalImage.height;
            ctx.drawImage(originalImage, 0, 0, canvas.width, canvas.height);

            let cleanJpegUrl = canvas.toDataURL('image/jpeg', 1.0);
            let finalDataUrl = cleanJpegUrl;
            let successMessage = "";
            let borderColor = "";

            try {
                if (action === 'add') {
                    const make = document.getElementById('exifMake').value || "Apple";
                    const model = document.getElementById('exifModel').value || "iPhone 15 Pro Max";

                    const zeroth = {};
                    zeroth[piexif.ImageIFD.Make] = make;
                    zeroth[piexif.ImageIFD.Model] = model;
                    zeroth[piexif.ImageIFD.Software] = "shuvoalltool.com";

                    const exifObj = {"0th": zeroth};
                    const exifBytes = piexif.dump(exifObj);
                    
                    finalDataUrl = piexif.insert(exifBytes, cleanJpegUrl);
                    
                    successMessage = `✅ Fake EXIF Added: ${make} ${model}`;
                    borderColor = "border-green-500";
                } else {
                    successMessage = "✅ EXIF Data Cleared!";
                    // Handle border color based on dark mode state dynamically using Tailwind class
                    borderColor = "border-blue-500"; 
                }

                finalBlob = dataURItoBlob(finalDataUrl);

                const objectUrl = URL.createObjectURL(finalBlob);
                imagePreview.src = objectUrl;
                
                imagePreview.classList.remove('border-gray-200', 'dark:border-gray-600');
                imagePreview.classList.add('border-2', borderColor);

                statusMsg.innerText = successMessage;
                statusMsg.className = `text-center text-[13px] font-bold mt-3 ${action === 'add' ? 'text-green-600 dark:text-green-400' : 'text-gray-800 dark:text-blue-400'}`;
                statusMsg.classList.remove('hidden');
                
                actionButtons.classList.add('hidden');
                actionButtons.classList.remove('flex');
                downloadBtn.classList.remove('hidden');

            } catch (error) {
                statusMsg.innerText = "❌ Error processing image!";
                statusMsg.className = "text-center text-[13px] font-bold mt-3 text-red-500";
                statusMsg.classList.remove('hidden');
            }
        }

        function dataURItoBlob(dataURI) {
            let byteString = atob(dataURI.split(',')[1]);
            let mimeString = dataURI.split(',')[0].split(':')[1].split(';')[0];
            let ab = new ArrayBuffer(byteString.length);
            let ia = new Uint8Array(ab);
            for (let i = 0; i < byteString.length; i++) {
                ia[i] = byteString.charCodeAt(i);
            }
            return new Blob([ab], {type: mimeString});
        }

        async function downloadImage() {
            if (!finalBlob) return;

            const newFileName = "ShuvoTool_" + originalFileName.split('.')[0] + ".jpg";
            const file = new File([finalBlob], newFileName, { type: "image/jpeg" });

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({
                        files: [file],
                        title: 'Processed Image'
                    });
                    return; 
                } catch (err) {
                    console.log("Share cancelled.");
                }
            }

            const objectUrl = URL.createObjectURL(finalBlob);
            const link = document.createElement('a');
            link.href = objectUrl;
            link.download = newFileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
            
            setTimeout(() => location.reload(), 1500);
        }
    </script>
</body>
</html>
